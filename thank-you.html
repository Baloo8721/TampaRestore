<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - TampaRestore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0A1628 0%, #1a3a5c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .icon { font-size: 72px; margin-bottom: 10px; }
    h1 { font-size: 28px; margin-bottom: 10px; }
    h1.accepted { color: #059669; }
    h1.declined { color: #D97706; }
    h1.card-saved { color: #059669; }
    .status-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    .status-badge.accepted { background: #ECFDF5; color: #059669; }
    .status-badge.declined { background: #FEF3C7; color: #D97706; }
    .status-badge.card-saved { background: #ECFDF5; color: #059669; }
    .message {
      color: #6B7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .contact-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #E5E7EB;
    }
    .contact-section p { color: #666; font-size: 14px; margin: 8px 0; }
    .contact-section a { color: #D92B2B; text-decoration: none; font-weight: 600; }
    .contact-section .phone { font-size: 18px; color: #0A1628; font-weight: 700; }
    .close-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 32px;
      background: #0A1628;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .close-btn:hover { background: #D92B2B; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">✅</div>
    <div class="status-badge accepted" id="badge">Accepted</div>
    <h1 class="accepted" id="title">Thank You!</h1>
    <div class="message" id="message">
      Check your email for lead details and next steps.
    </div>
    <div class="contact-section">
      <p>Questions? Contact Tyler:</p>
      <p class="phone">📞 (813) 482-8671</p>
      <p>📧 <a href="mailto:tylerbelislefl@gmail.com">tylerbelislefl@gmail.com</a></p>
    </div>
    <a href="#" class="close-btn" onclick="window.close(); return false;">Close Window</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const action = params.get('action');
    const icon = document.getElementById('icon');
    const badge = document.getElementById('badge');
    const title = document.getElementById('title');
    const msg = document.getElementById('message');

    if (action === 'decline' || action === 'pass') {
      icon.textContent = '➡️';
      badge.textContent = 'Passed On';
      badge.className = 'status-badge declined';
      title.textContent = 'Lead Passed On';
      title.className = 'declined';
      msg.textContent = 'The next available contractor will be notified.';
    } else if (action === 'card_saved') {
      icon.textContent = '💳';
      badge.textContent = 'Card Saved';
      badge.className = 'status-badge card-saved';
      title.textContent = 'Card Saved Successfully';
      title.className = 'card-saved';
      msg.textContent = 'Your card is saved. When the admin enables auto-pay, you\'ll be charged automatically on lead acceptance. No charges right now.';
    } else if (action === 'setup_cancelled') {
      icon.textContent = '💳';
      badge.textContent = 'Setup Cancelled';
      badge.className = 'status-badge declined';
      title.textContent = 'Card Setup Cancelled';
      title.className = 'declined';
      msg.textContent = 'No changes were made. You can set up your card later from the link in your email.';
    } else if (action === 'paid') {
      icon.textContent = '💰';
      badge.textContent = 'Payment Received';
      badge.className = 'status-badge card-saved';
      title.textContent = 'Payment Successful';
      title.className = 'card-saved';
      msg.textContent = 'Thank you! Your payment has been received and your invoices are marked as paid.';
    } else {
      icon.textContent = '✅';
      badge.textContent = 'Accepted';
      badge.className = 'status-badge accepted';
      title.textContent = 'Thank You!';
      title.className = 'accepted';
      msg.textContent = 'Check your email for lead details and next steps.';
    }
  </script>
</body>
</html>
